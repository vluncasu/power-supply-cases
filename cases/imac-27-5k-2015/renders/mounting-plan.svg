<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc"><title id="title">ARC Slim Grip mounting references</title><desc id="desc">Top view of the nominal PCB with four estimated hole positions. Vertical section gives CAD clearance above and below the board.</desc><rect width="800" height="430" fill="#faf8f3"/><g font-family="sans-serif" fill="#213941"><text x="30" y="35" font-size="22" font-weight="bold">ARC Slim Grip · mounting references</text><text x="30" y="62" font-size="15">Top view · origin at upper left · dimensions in mm</text><rect x="36" y="99" width="326" height="264" rx="2" fill="#dde8e3" stroke="#44585a"/><text x="175" y="89">163 mm</text><text x="371" y="235">132 mm</text><circle cx="60" cy="105" r="4" fill="#0c645c"/><text x="68" y="125" text-anchor="start" font-size="15">A (12, 3)</text><circle cx="356" cy="105" r="4" fill="#0c645c"/><text x="348" y="125" text-anchor="end" font-size="15">B (160, 3)</text><circle cx="46" cy="303" r="4" fill="#0c645c"/><text x="54" y="323" text-anchor="start" font-size="15">C (5, 102)</text><circle cx="352" cy="303" r="4" fill="#0c645c"/><text x="344" y="323" text-anchor="end" font-size="15">D (158, 102)</text><text x="451" y="104" font-size="18" font-weight="bold">Vertical section</text><text x="451" y="131" font-size="14">Clearance at maximum component height</text><rect x="455" y="158" width="292" height="7" fill="#253d44"/><rect x="455" y="183" width="190" height="126" fill="#c2d8cd"/><rect x="455" y="309" width="292" height="3" fill="#276454"/><rect x="455" y="323" width="292" height="8" fill="#253d44"/><g font-size="14"><text x="460" y="180">5 mm · overhead clearance</text><text x="465" y="250">35 mm · component height</text><text x="460" y="356">3.4 mm · nominal underside gap</text><text x="30" y="405">Hole centers estimated from photographs. Verify the physical board before mounting.</text></g></g></svg>