name: Check print files
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    name: Validate STL meshes and P1S plates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install geometry verification dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Check geometry, quantities and distribution hashes
        run: python tools/verify.py
